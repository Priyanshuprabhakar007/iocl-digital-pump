<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Outer Circular Border & Ring -->
  <circle cx="250" cy="250" r="240" fill="#002147" />
  <circle cx="250" cy="250" r="226" fill="#FFFFFF" />
  <circle cx="250" cy="250" r="220" fill="#F37021" />

  <!-- Center Blue Band Clip Path or Rect -->
  <g>
    <!-- We clip or draw the center blue rectangle spanning across the circle -->
    <path d="M 50 170 L 450 170 L 450 330 L 50 330 Z" fill="#002147" />
    
    <!-- White divider lines above and below the blue band -->
    <line x1="55" y1="170" x2="445" y2="170" stroke="#FFFFFF" stroke-width="4" />
    <line x1="55" y1="330" x2="445" y2="330" stroke="#FFFFFF" stroke-width="4" />

    <!-- Hindi Text "इण्डियनऑयल" -->
    <text x="250" y="262" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="800" 
          font-size="62" 
          fill="#FFFFFF" 
          text-anchor="middle" 
          letter-spacing="1">इण्डियनऑयल</text>
  </g>
</svg>
