name: CI Pipeline

on:
  push:
    branches: ["main", "master", "test/stage01h-recovery-ci-validation-20261112", "test/stage01q-idempotency-contract-20261114", "test/stage01r-source-snapshot-fence-20261114", "fix/stage01r2-close-input-route-lock-20261114", "test/stage01s-proposed-d1-source-triggers-20261114", "test/stage01s2-financial-source-triggers-20261114", "test/stage01t-combined-guards-full-close-20261114", "fix/stage01u-atomic-admin-empty-audit-20261114", "test/stage01v-final-release-gate-20261114", "test/stage01w-atomic-source-version-fence-20261114", "test/stage01x-isolated-full-staging-config-20261114", "test/stage01y-baseline-migration-offline-preflight-20261114", "test/stage01z-d1-migration-compatibility-gate-20261114"]
  pull_request:
    branches: ["main", "master", "test/stage01g-recovery-classifier-20261112"]

jobs:
  validate:
    name: Build, Typecheck & Test (Bun)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Typecheck
        run: bun run typecheck

      - name: Run Test Suite
        run: bun test

      - name: Build Production Assets
        run: bun run build
