name: Deploy Cloudflare Demo

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Typecheck, Test, Build & Deploy to Cloudflare
    runs-on: ubuntu-latest

    steps:
      - name: Workflow Warning Banner
        run: |
          echo "=================================================="
          echo "PRODUCTION DATA SAFETY MODE:"
          echo "Remote demo seeding is disabled."
          echo "Existing D1 operational data will be preserved."
          echo "=================================================="

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Typecheck
        run: bun run typecheck

      - name: Run Test Suite
        run: bun test

      - name: Build Frontend Assets
        run: bun run build

      - name: Verify Base D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RESULT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM d1_migrations WHERE name = '0013_cng_financial_integration.sql';" \
            --json \
            --yes)

          COUNT=$(echo "$RESULT" | jq -r '.[0].results[0].count // 0')

          echo "0013 migration recorded: $COUNT"

          if [ "$COUNT" != "1" ]; then
            echo "ERROR: Expected migration 0013 to be applied before the trigger migration compatibility path."
            exit 1
          fi

      - name: Capture Pre-Migration Operational Data Counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== CAPTURING PRE-MIGRATION TABLE COUNTS ==="
          mkdir -p .d1_counts
          TABLES=(
            "users"
            "retail_outlets"
            "products"
            "outlet_products"
            "tanks"
            "dispensers"
            "nozzles"
            "operational_shifts"
            "nozzle_meter_readings"
            "tank_stock_readings"
            "fuel_receipts"
            "fuel_receipt_tank_lines"
            "outlet_product_prices"
            "credit_parties"
            "credit_parties_v2"
            "shift_collections"
            "shift_collections_v2"
            "cash_handover_logs"
            "cash_handover_logs_v2"
            "bank_deposits"
            "bank_deposits_v2"
            "shift_financial_reconciliations"
            "cng_shift_logs"
            "cng_pressure_readings"
            "lube_skus"
            "lube_sku_prices"
            "lube_stock_transactions"
            "lube_shift_sales"
            "equipment_assets"
            "equipment_breakdown_tickets"
            "equipment_breakdown_events"
            "dg_daily_logs"
            "dg_run_intervals"
            "utility_electricity_accounts"
            "utility_electricity_bills"
            "utility_sub_meters"
            "utility_sub_meter_readings"
            "municipal_tax_dues"
            "nfr_spaces"
            "nfr_vendors"
            "nfr_leases"
            "nfr_rent_dues"
            "nfr_rent_payments"
            "hr_designations"
            "hr_staff"
            "hr_manpower_sanctions"
            "hr_roster_assignments"
            "hr_attendance_records"
            "hr_outlet_geofence_policies"
            "hr_nozzle_assignments"
            "hr_uniform_items"
            "hr_uniform_variants"
            "hr_uniform_stock_transactions"
            "hr_uniform_issues"
            "hr_leave_requests"
            "org_departments"
            "org_officers"
            "org_officer_postings"
            "service_providers"
            "outlet_service_provider_assignments"
            "user_permission_overrides"
            "documents"
            "audit_logs"
          )

          TABLES_RESULT=$(npx wrangler d1 execute iocl-pump-manager-d1 --remote --command "SELECT name FROM sqlite_master WHERE type='table';" --json --yes)

          for T in "${TABLES[@]}"; do
            EXISTS=$(echo "$TABLES_RESULT" | jq --arg t "$T" '.[0].results | map(select(.name == $t)) | length')
            if [ "$EXISTS" -gt 0 ]; then
              CNT_RES=$(npx wrangler d1 execute iocl-pump-manager-d1 --remote --command "SELECT COUNT(*) AS count FROM $T;" --json --yes)
              CNT=$(echo "$CNT_RES" | jq -r '.[0].results[0].count // 0')
              echo "$CNT" > ".d1_counts/pre_$T.txt"
              echo "Pre-migration count for $T: $CNT"
            else
              echo "Table $T does not exist yet pre-migration."
            fi
          done

      - name: Apply Trigger Migrations via D1 Import
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          MIGRATIONS=(
            "migrations/0014_phase3b_lube_operations.sql"
            "migrations/0015_phase3c_equipment_breakdowns.sql"
            "migrations/0016_phase4a_utilities.sql"
            "migrations/0017_phase4b_municipal_taxes.sql"
            "migrations/0018_phase4c_nfr_leases_rent.sql"
            "migrations/0019_phase5a_workforce_roster.sql"
            "migrations/0020_phase5b_attendance_geofence_nozzle_assignments.sql"
            "migrations/0021_phase5c_uniform_management.sql"
            "migrations/0022_user_permission_overrides.sql"
            "migrations/0023_org_officer_service_provider.sql"
            "migrations/0024_phase3_du_nozzle_capacity.sql"
            "migrations/0025_phase4_hr_skill_categories.sql"
            "migrations/0026_phase5a_hr_leave_maker_checker.sql"
            "migrations/0027_outlet_directory_visibility.sql"
            "migrations/0028_dg_daily_operations_reporting.sql"
            "migrations/0029_dg_report_permissions.sql"
            "migrations/0030_outlet_archive_lifecycle.sql"
          )

          for FILE in "${MIGRATIONS[@]}"; do
            NAME=$(basename "$FILE")

            echo "Checking migration: $NAME"

            RESULT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
              --remote \
              --command "SELECT COUNT(*) AS count FROM d1_migrations WHERE name = '$NAME';" \
              --json \
              --yes)

            COUNT=$(echo "$RESULT" | jq -r '.[0].results[0].count // 0')

            if [ "$COUNT" = "1" ]; then
              echo "Already applied: $NAME"
              continue
            fi

            echo "Applying through D1 file import: $NAME"

            npx wrangler d1 execute iocl-pump-manager-d1 \
              --remote \
              --file="$FILE" \
              --yes

            echo "Recording migration: $NAME"

            npx wrangler d1 execute iocl-pump-manager-d1 \
              --remote \
              --command "INSERT OR IGNORE INTO d1_migrations (name) VALUES ('$NAME');" \
              --yes

            echo "Completed: $NAME"
          done

      - name: Apply Migration 0031 via Ordered Remote Batches
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          MIGRATION_0031="0031_idempotency_and_unique_constraints.sql"
          echo "Checking migration: $MIGRATION_0031"

          RESULT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM d1_migrations WHERE name = '$MIGRATION_0031';" \
            --json \
            --yes)

          COUNT=$(echo "$RESULT" | jq -r '.[0].results[0].count // 0')

          if [ "$COUNT" = "1" ]; then
            echo "Already applied: $MIGRATION_0031"
            exit 0
          fi

          echo "[0031] Checking duplicate data..."

          apply_unique_index_with_diagnostic() {
            local INDEX_NAME="$1"
            local DIAG_SQL="$2"
            local INDEX_SQL="$3"

            local DUP_RES
            DUP_RES=$(npx wrangler d1 execute iocl-pump-manager-d1 \
              --remote \
              --command "$DIAG_SQL" \
              --json \
              --yes)

            local DUP_COUNT
            DUP_COUNT=$(echo "$DUP_RES" | jq -r '.[0].results | length')

            if [ "$DUP_COUNT" -gt "0" ]; then
              echo "ERROR: [0031] Duplicate records detected for ${INDEX_NAME} (groups=${DUP_COUNT}). Aborting without modifying data."
              echo "$DUP_RES" | jq -r '.[0].results[] | "  Duplicate business key: \(.key_summary) (count=\(.cnt))"'
              exit 1
            fi

            echo "[0031] Applying ${INDEX_NAME}..."
            npx wrangler d1 execute iocl-pump-manager-d1 \
              --remote \
              --command "$INDEX_SQL" \
              --yes
          }

          # BATCH 1: Create idempotency_keys table
          echo "[0031] Creating idempotency_keys..."
          npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command 'CREATE TABLE IF NOT EXISTS "idempotency_keys" ("id" text PRIMARY KEY NOT NULL, "idempotency_key" text NOT NULL, "actor_id" text NOT NULL, "route" text NOT NULL, "request_fingerprint" text NOT NULL, "response_status" integer NOT NULL, "entity_id" text, "response_body" text NOT NULL, "created_at" text NOT NULL);' \
            --yes

          # BATCH 2: Create uq_idempotency_keys_key_actor index
          echo "[0031] Applying uq_idempotency_keys_key_actor..."
          npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command 'CREATE UNIQUE INDEX IF NOT EXISTS "uq_idempotency_keys_key_actor" ON "idempotency_keys" ("idempotency_key", "actor_id");' \
            --yes

          # BATCH 3: Create idx_idempotency_keys_created_at index
          echo "[0031] Applying idx_idempotency_keys_created_at..."
          npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command 'CREATE INDEX IF NOT EXISTS "idx_idempotency_keys_created_at" ON "idempotency_keys" ("created_at");' \
            --yes

          # 1. uq_user_scope_assignments_natural
          apply_unique_index_with_diagnostic \
            "uq_user_scope_assignments_natural" \
            "SELECT user_id || ':' || scope_level || ':' || COALESCE(state_id,'') || ':' || COALESCE(division_id,'') || ':' || COALESCE(sales_area_id,'') || ':' || COALESCE(outlet_id,'') AS key_summary, COUNT(*) AS cnt FROM user_scope_assignments GROUP BY user_id, scope_level, COALESCE(state_id,''), COALESCE(division_id,''), COALESCE(sales_area_id,''), COALESCE(outlet_id,'') HAVING COUNT(*) > 1;" \
            'CREATE UNIQUE INDEX IF NOT EXISTS "uq_user_scope_assignments_natural" ON "user_scope_assignments" ("user_id", "scope_level", COALESCE("state_id", '\'''\''), COALESCE("division_id", '\'''\''), COALESCE("sales_area_id", '\'''\''), COALESCE("outlet_id", '\'''\''));'

          # 2. uq_outlet_user_assignments_natural
          apply_unique_index_with_diagnostic \
            "uq_outlet_user_assignments_natural" \
            "SELECT outlet_id || ':' || user_id || ':' || assignment_type AS key_summary, COUNT(*) AS cnt FROM outlet_user_assignments GROUP BY outlet_id, user_id, assignment_type HAVING COUNT(*) > 1;" \
            'CREATE UNIQUE INDEX IF NOT EXISTS "uq_outlet_user_assignments_natural" ON "outlet_user_assignments" ("outlet_id", "user_id", "assignment_type");'

          # 3. uq_fuel_receipts_outlet_invoice
          apply_unique_index_with_diagnostic \
            "uq_fuel_receipts_outlet_invoice" \
            "SELECT outlet_id || ':' || invoice_number AS key_summary, COUNT(*) AS cnt FROM fuel_receipts WHERE status != 'CANCELLED' GROUP BY outlet_id, invoice_number HAVING COUNT(*) > 1;" \
            'CREATE UNIQUE INDEX IF NOT EXISTS "uq_fuel_receipts_outlet_invoice" ON "fuel_receipts" ("outlet_id", "invoice_number") WHERE status != '\''CANCELLED'\'';'

          # 4. uq_fuel_receipt_lines_receipt_tank
          apply_unique_index_with_diagnostic \
            "uq_fuel_receipt_lines_receipt_tank" \
            "SELECT fuel_receipt_id || ':' || tank_id AS key_summary, COUNT(*) AS cnt FROM fuel_receipt_tank_lines GROUP BY fuel_receipt_id, tank_id HAVING COUNT(*) > 1;" \
            'CREATE UNIQUE INDEX IF NOT EXISTS "uq_fuel_receipt_lines_receipt_tank" ON "fuel_receipt_tank_lines" ("fuel_receipt_id", "tank_id");'

          # 5. uq_outlet_product_prices_active_start
          apply_unique_index_with_diagnostic \
            "uq_outlet_product_prices_active_start" \
            "SELECT outlet_id || ':' || product_id || ':' || effective_from AS key_summary, COUNT(*) AS cnt FROM outlet_product_prices WHERE status = 'ACTIVE' GROUP BY outlet_id, product_id, effective_from HAVING COUNT(*) > 1;" \
            'CREATE UNIQUE INDEX IF NOT EXISTS "uq_outlet_product_prices_active_start" ON "outlet_product_prices" ("outlet_id", "product_id", "effective_from") WHERE status = '\''ACTIVE'\'';'

          # 6. uq_shift_collections_shift_type_ref
          apply_unique_index_with_diagnostic \
            "uq_shift_collections_shift_type_ref" \
            "SELECT operational_shift_id || ':' || collection_type || ':' || reference_number AS key_summary, COUNT(*) AS cnt FROM shift_collections WHERE reference_number IS NOT NULL AND trim(reference_number) != '' GROUP BY operational_shift_id, collection_type, reference_number HAVING COUNT(*) > 1;" \
            'CREATE UNIQUE INDEX IF NOT EXISTS "uq_shift_collections_shift_type_ref" ON "shift_collections" ("operational_shift_id", "collection_type", "reference_number") WHERE reference_number IS NOT NULL AND trim(reference_number) != '\'''\'';'

          # 7. uq_bank_deposits_outlet_channel_ref
          apply_unique_index_with_diagnostic \
            "uq_bank_deposits_outlet_channel_ref" \
            "SELECT outlet_id || ':' || deposit_channel || ':' || reference_number AS key_summary, COUNT(*) AS cnt FROM bank_deposits WHERE reference_number IS NOT NULL AND trim(reference_number) != '' AND status != 'REJECTED' GROUP BY outlet_id, deposit_channel, reference_number HAVING COUNT(*) > 1;" \
            'CREATE UNIQUE INDEX IF NOT EXISTS "uq_bank_deposits_outlet_channel_ref" ON "bank_deposits" ("outlet_id", "deposit_channel", "reference_number") WHERE reference_number IS NOT NULL AND trim(reference_number) != '\'''\'' AND status != '\''REJECTED'\'';'

          # 8. uq_lube_sku_prices_active_start
          apply_unique_index_with_diagnostic \
            "uq_lube_sku_prices_active_start" \
            "SELECT outlet_id || ':' || lube_sku_id || ':' || effective_from AS key_summary, COUNT(*) AS cnt FROM lube_sku_prices WHERE status = 'ACTIVE' GROUP BY outlet_id, lube_sku_id, effective_from HAVING COUNT(*) > 1;" \
            'CREATE UNIQUE INDEX IF NOT EXISTS "uq_lube_sku_prices_active_start" ON "lube_sku_prices" ("outlet_id", "lube_sku_id", "effective_from") WHERE status = '\''ACTIVE'\'';'

          # 9. uq_lube_stock_tx_opening_balance
          apply_unique_index_with_diagnostic \
            "uq_lube_stock_tx_opening_balance" \
            "SELECT outlet_id || ':' || lube_sku_id AS key_summary, COUNT(*) AS cnt FROM lube_stock_transactions WHERE transaction_type = 'OPENING_BALANCE' GROUP BY outlet_id, lube_sku_id HAVING COUNT(*) > 1;" \
            'CREATE UNIQUE INDEX IF NOT EXISTS "uq_lube_stock_tx_opening_balance" ON "lube_stock_transactions" ("outlet_id", "lube_sku_id") WHERE transaction_type = '\''OPENING_BALANCE'\'';'

          # 10. uq_nfr_rent_payments_due_ref
          apply_unique_index_with_diagnostic \
            "uq_nfr_rent_payments_due_ref" \
            "SELECT rent_due_id || ':' || payment_reference AS key_summary, COUNT(*) AS cnt FROM nfr_rent_payments WHERE payment_reference IS NOT NULL AND trim(payment_reference) != '' GROUP BY rent_due_id, payment_reference HAVING COUNT(*) > 1;" \
            'CREATE UNIQUE INDEX IF NOT EXISTS "uq_nfr_rent_payments_due_ref" ON "nfr_rent_payments" ("rent_due_id", "payment_reference") WHERE payment_reference IS NOT NULL AND trim(payment_reference) != '\'''\'';'

          # 11. uq_org_officers_email
          apply_unique_index_with_diagnostic \
            "uq_org_officers_email" \
            "SELECT email AS key_summary, COUNT(*) AS cnt FROM org_officers WHERE email IS NOT NULL AND trim(email) != '' GROUP BY email HAVING COUNT(*) > 1;" \
            'CREATE UNIQUE INDEX IF NOT EXISTS "uq_org_officers_email" ON "org_officers" ("email") WHERE email IS NOT NULL AND trim(email) != '\'''\'';'

          # 12. uq_org_officer_postings_active
          apply_unique_index_with_diagnostic \
            "uq_org_officer_postings_active" \
            "SELECT officer_id || ':' || scope_level || ':' || COALESCE(state_id,'') || ':' || COALESCE(division_id,'') || ':' || COALESCE(sales_area_id,'') || ':' || COALESCE(outlet_id,'') AS key_summary, COUNT(*) AS cnt FROM org_officer_postings WHERE status = 'ACTIVE' GROUP BY officer_id, scope_level, COALESCE(state_id,''), COALESCE(division_id,''), COALESCE(sales_area_id,''), COALESCE(outlet_id,'') HAVING COUNT(*) > 1;" \
            'CREATE UNIQUE INDEX IF NOT EXISTS "uq_org_officer_postings_active" ON "org_officer_postings" ("officer_id", "scope_level", COALESCE("state_id", '\'''\''), COALESCE("division_id", '\'''\''), COALESCE("sales_area_id", '\'''\''), COALESCE("outlet_id", '\'''\'')) WHERE status = '\''ACTIVE'\'';'

          # 13. uq_outlet_sp_assignments_natural
          apply_unique_index_with_diagnostic \
            "uq_outlet_sp_assignments_natural" \
            "SELECT outlet_id || ':' || service_provider_id || ':' || effective_from || ':' || COALESCE(contract_number,'') AS key_summary, COUNT(*) AS cnt FROM outlet_service_provider_assignments WHERE status = 'ACTIVE' GROUP BY outlet_id, service_provider_id, effective_from, COALESCE(contract_number,'') HAVING COUNT(*) > 1;" \
            'CREATE UNIQUE INDEX IF NOT EXISTS "uq_outlet_sp_assignments_natural" ON "outlet_service_provider_assignments" ("outlet_id", "service_provider_id", "effective_from", COALESCE("contract_number", '\'''\'')) WHERE status = '\''ACTIVE'\'';'

          # 14. uq_hr_leave_requests_active_dates
          apply_unique_index_with_diagnostic \
            "uq_hr_leave_requests_active_dates" \
            "SELECT staff_id || ':' || from_date || ':' || to_date AS key_summary, COUNT(*) AS cnt FROM hr_leave_requests WHERE status IN ('PENDING', 'APPROVED') GROUP BY staff_id, from_date, to_date HAVING COUNT(*) > 1;" \
            'CREATE UNIQUE INDEX IF NOT EXISTS "uq_hr_leave_requests_active_dates" ON "hr_leave_requests" ("staff_id", "from_date", "to_date") WHERE status IN ('\''PENDING'\'', '\''APPROVED'\'');'

          # Verify table and all migration 0031 indexes exist in sqlite_master
          TABLE_VERIFY=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'idempotency_keys';" \
            --json \
            --yes)

          TABLE_FOUND=$(echo "$TABLE_VERIFY" | jq -r '.[0].results | length')
          if [ "$TABLE_FOUND" != "1" ]; then
            echo "ERROR: [0031] Table idempotency_keys was not found in sqlite_master after execution."
            exit 1
          fi

          INDEX_VERIFY=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT name FROM sqlite_master WHERE type = 'index' AND name IN ('uq_user_scope_assignments_natural', 'uq_outlet_user_assignments_natural', 'uq_fuel_receipts_outlet_invoice', 'uq_fuel_receipt_lines_receipt_tank', 'uq_outlet_product_prices_active_start', 'uq_shift_collections_shift_type_ref', 'uq_bank_deposits_outlet_channel_ref', 'uq_lube_sku_prices_active_start', 'uq_lube_stock_tx_opening_balance', 'uq_nfr_rent_payments_due_ref', 'uq_org_officers_email', 'uq_org_officer_postings_active', 'uq_outlet_sp_assignments_natural', 'uq_hr_leave_requests_active_dates');" \
            --json \
            --yes)

          INDEX_COUNT=$(echo "$INDEX_VERIFY" | jq -r '.[0].results | length')
          if [ "$INDEX_COUNT" != "14" ]; then
            echo "ERROR: [0031] Expected 14 unique business indexes in sqlite_master, found $INDEX_COUNT."
            exit 1
          fi

          IDEM_INDEX_VERIFY=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT name FROM sqlite_master WHERE type = 'index' AND name IN ('uq_idempotency_keys_key_actor', 'idx_idempotency_keys_created_at');" \
            --json \
            --yes)

          IDEM_INDEX_COUNT=$(echo "$IDEM_INDEX_VERIFY" | jq -r '.[0].results | length')
          if [ "$IDEM_INDEX_COUNT" != "2" ]; then
            echo "ERROR: [0031] Expected 2 idempotency_keys indexes in sqlite_master, found $IDEM_INDEX_COUNT."
            exit 1
          fi

          echo "[0031] Verified 14 unique indexes..."

          npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0031_idempotency_and_unique_constraints.sql');" \
            --yes

          echo "[0031] Migration completed and recorded."

      - name: Apply Migration 0032 via Ordered Safe Stages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          MIGRATION_0032="0032_global_designation_and_shift_masters.sql"
          echo "=================================================="
          echo "CHECKING MIGRATION 0032: $MIGRATION_0032"
          echo "=================================================="

          # 1. PRECHECK MIGRATION STATUS
          RESULT_0032=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM d1_migrations WHERE name = '$MIGRATION_0032';" \
            --json \
            --yes)

          COUNT_0032=$(echo "$RESULT_0032" | jq -r '.[0].results[0].count // 0')

          # 2. CHECK TABLE STATE
          TABLE_CHECK_RES=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('global_hr_designations', 'global_shift_templates');" \
            --json \
            --yes)

          GLOBAL_TABLES_COUNT=$(echo "$TABLE_CHECK_RES" | jq -r '.[0].results | length')

          echo "Precheck 0032: migration recorded in d1_migrations=$COUNT_0032, global master tables count=$GLOBAL_TABLES_COUNT"

          if [ "$COUNT_0032" = "1" ] && [ "$GLOBAL_TABLES_COUNT" = "2" ]; then
            echo "Already applied: $MIGRATION_0032 (both global master tables verified). Skipping safely."
            exit 0
          fi

          if [ "$COUNT_0032" = "0" ] && [ "$GLOBAL_TABLES_COUNT" = "2" ]; then
            echo "ERROR: [0032] Partial migration state detected: global tables exist but $MIGRATION_0032 is not recorded in d1_migrations. Aborting deployment."
            exit 1
          fi

          if [ "$GLOBAL_TABLES_COUNT" = "1" ]; then
            echo "ERROR: [0032] Inconsistent migration state detected: only one of global_hr_designations / global_shift_templates exists in sqlite_master. Aborting deployment."
            exit 1
          fi

          if [ "$COUNT_0032" = "1" ] && [ "$GLOBAL_TABLES_COUNT" = "0" ]; then
            echo "ERROR: [0032] Inconsistent migration state detected: $MIGRATION_0032 recorded in d1_migrations but global tables missing. Aborting deployment."
            exit 1
          fi

          # 3. RUN GLOBAL MASTER CONFLICT DIAGNOSTICS
          echo "[0032] Running designation conflict diagnostic..."
          HAS_DESIG_TABLE=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM sqlite_master WHERE type='table' AND name = 'hr_designations';" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          if [ "$HAS_DESIG_TABLE" = "1" ]; then
            DESIG_CONFLICT_RES=$(npx wrangler d1 execute iocl-pump-manager-d1 \
              --remote \
              --command "SELECT UPPER(TRIM(code)) AS normalized_code, COUNT(*) AS count, GROUP_CONCAT(id) AS ids, GROUP_CONCAT(outlet_id) AS outlets, GROUP_CONCAT(name) AS names, GROUP_CONCAT(COALESCE(skill_category, 'NULL')) AS skill_categories, GROUP_CONCAT(status) AS statuses FROM hr_designations GROUP BY UPPER(TRIM(code)) HAVING COUNT(DISTINCT TRIM(name)) > 1 OR COUNT(DISTINCT COALESCE(skill_category, 'NULL')) > 1 OR COUNT(DISTINCT status) > 1;" \
              --json \
              --yes)

            DESIG_CONFLICT_COUNT=$(echo "$DESIG_CONFLICT_RES" | jq -r '.[0].results | length')
            if [ "$DESIG_CONFLICT_COUNT" -gt "0" ]; then
              echo "ERROR: [0032] Global master conflict detected in hr_designations (groups=$DESIG_CONFLICT_COUNT). Aborting deployment safely without altering DB."
              echo "$DESIG_CONFLICT_RES" | jq -r '.[0].results[] | "  Conflict in designation code \(.normalized_code): names=\(.names) skills=\(.skill_categories) statuses=\(.statuses) outlets=\(.outlets)"'
              exit 1
            fi
          fi

          echo "[0032] Running shift conflict diagnostic..."
          HAS_SHIFT_TABLE=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM sqlite_master WHERE type='table' AND name = 'shift_templates';" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          if [ "$HAS_SHIFT_TABLE" = "1" ]; then
            SHIFT_CONFLICT_RES=$(npx wrangler d1 execute iocl-pump-manager-d1 \
              --remote \
              --command "SELECT UPPER(TRIM(code)) AS normalized_code, COUNT(*) AS count, GROUP_CONCAT(id) AS ids, GROUP_CONCAT(outlet_id) AS outlets, GROUP_CONCAT(name) AS names, GROUP_CONCAT(start_time) AS start_times, GROUP_CONCAT(end_time) AS end_times, GROUP_CONCAT(sequence) AS sequences FROM shift_templates GROUP BY UPPER(TRIM(code)) HAVING COUNT(DISTINCT TRIM(name)) > 1 OR COUNT(DISTINCT start_time) > 1 OR COUNT(DISTINCT end_time) > 1 OR COUNT(DISTINCT sequence) > 1;" \
              --json \
              --yes)

            SHIFT_CONFLICT_COUNT=$(echo "$SHIFT_CONFLICT_RES" | jq -r '.[0].results | length')
            if [ "$SHIFT_CONFLICT_COUNT" -gt "0" ]; then
              echo "ERROR: [0032] Global master conflict detected in shift_templates (groups=$SHIFT_CONFLICT_COUNT). Aborting deployment safely without altering DB."
              echo "$SHIFT_CONFLICT_RES" | jq -r '.[0].results[] | "  Conflict in shift code \(.normalized_code): names=\(.names) start_times=\(.start_times) end_times=\(.end_times) sequences=\(.sequences) outlets=\(.outlets)"'
              exit 1
            fi
          fi
          echo "[0032] Conflict diagnostics passed (0 conflicting definitions)."

          # 4. CAPTURE PRE-MIGRATION COUNTS
          echo "[0032] Capturing pre-migration counts..."
          get_table_count() {
            local tbl="$1"
            local tbl_exists
            tbl_exists=$(npx wrangler d1 execute iocl-pump-manager-d1 \
              --remote \
              --command "SELECT COUNT(*) AS count FROM sqlite_master WHERE type='table' AND name = '$tbl';" \
              --json --yes | jq -r '.[0].results[0].count // 0')
            if [ "$tbl_exists" = "1" ]; then
              npx wrangler d1 execute iocl-pump-manager-d1 \
                --remote \
                --command "SELECT COUNT(*) AS count FROM \"$tbl\";" \
                --json --yes | jq -r '.[0].results[0].count // 0'
            else
              echo "0"
            fi
          }

          PRE_0032_OP_SHIFTS=$(get_table_count "operational_shifts")
          PRE_0032_HR_STAFF=$(get_table_count "hr_staff")
          PRE_0032_HR_MANPOWER=$(get_table_count "hr_manpower_sanctions")
          PRE_0032_HR_ROSTER=$(get_table_count "hr_roster_assignments")
          PRE_0032_HR_ATTENDANCE=$(get_table_count "hr_attendance_records")
          PRE_0032_HR_NOZZLE=$(get_table_count "hr_nozzle_assignments")
          PRE_0032_HR_DESIG=$(get_table_count "hr_designations")
          PRE_0032_SHIFT_TMPL=$(get_table_count "shift_templates")

          echo "[0032] Pre-counts captured: op_shifts=$PRE_0032_OP_SHIFTS, hr_staff=$PRE_0032_HR_STAFF, hr_manpower=$PRE_0032_HR_MANPOWER, hr_roster=$PRE_0032_HR_ROSTER, hr_attendance=$PRE_0032_HR_ATTENDANCE, hr_nozzle=$PRE_0032_HR_NOZZLE, hr_desig=$PRE_0032_HR_DESIG, shift_tmpl=$PRE_0032_SHIFT_TMPL"

          # 5. APPLY 0032 SAFELY IN ORDERED STAGES
          echo "[0032] Stage A: creating global master tables, indexes, and triggers..."
          npx wrangler d1 execute iocl-pump-manager-d1 --remote --file=migrations/0032_stages/01_stage_a_create_global_masters.sql --yes

          echo "[0032] Stage B: populating global masters from legacy tables..."
          npx wrangler d1 execute iocl-pump-manager-d1 --remote --file=migrations/0032_stages/02_stage_b_populate_global_masters.sql --yes

          echo "[0032] Stage C: updating old references to global IDs..."
          npx wrangler d1 execute iocl-pump-manager-d1 --remote --file=migrations/0032_stages/03_stage_c_update_references.sql --yes

          echo "[0032] Stage D: rebuilding operational_shifts..."
          npx wrangler d1 execute iocl-pump-manager-d1 --remote --file=migrations/0032_stages/04_stage_d_rebuild_operational_shifts.sql --yes

          echo "[0032] Stage E: rebuilding HR dependent tables..."
          npx wrangler d1 execute iocl-pump-manager-d1 --remote --file=migrations/0032_stages/05_stage_e_rebuild_hr_tables.sql --yes

          echo "[0032] Stage F: recreating indexes and integrity triggers..."
          npx wrangler d1 execute iocl-pump-manager-d1 --remote --file=migrations/0032_stages/06_stage_f_triggers_and_indexes.sql --yes

          # 6. POST-MIGRATION VERIFICATION (Stage G)
          echo "[0032] Stage G: Verifying post-migration state..."
          VERIFY_TABLES=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('global_hr_designations', 'global_shift_templates');" \
            --json \
            --yes)
          POST_GLOBAL_TABLE_COUNT=$(echo "$VERIFY_TABLES" | jq -r '.[0].results | length')
          if [ "$POST_GLOBAL_TABLE_COUNT" -ne 2 ]; then
            echo "ERROR: [0032] Both global master tables must exist in sqlite_master (found $POST_GLOBAL_TABLE_COUNT / 2)."
            exit 1
          fi

          POST_0032_GLOBAL_DESIG=$(get_table_count "global_hr_designations")
          POST_0032_GLOBAL_SHIFT=$(get_table_count "global_shift_templates")

          echo "[0032] Global master counts: global_hr_designations=$POST_0032_GLOBAL_DESIG, global_shift_templates=$POST_0032_GLOBAL_SHIFT"

          if [ "$PRE_0032_HR_DESIG" -gt 0 ] && [ "$POST_0032_GLOBAL_DESIG" -le 0 ]; then
            echo "ERROR: [0032] Legacy hr_designations had $PRE_0032_HR_DESIG records but global_hr_designations is empty."
            exit 1
          fi

          if [ "$PRE_0032_SHIFT_TMPL" -gt 0 ] && [ "$POST_0032_GLOBAL_SHIFT" -le 0 ]; then
            echo "ERROR: [0032] Legacy shift_templates had $PRE_0032_SHIFT_TMPL records but global_shift_templates is empty."
            exit 1
          fi

          POST_0032_OP_SHIFTS=$(get_table_count "operational_shifts")
          POST_0032_HR_STAFF=$(get_table_count "hr_staff")
          POST_0032_HR_MANPOWER=$(get_table_count "hr_manpower_sanctions")
          POST_0032_HR_ROSTER=$(get_table_count "hr_roster_assignments")
          POST_0032_HR_ATTENDANCE=$(get_table_count "hr_attendance_records")
          POST_0032_HR_NOZZLE=$(get_table_count "hr_nozzle_assignments")

          echo "[0032] Rebuilt table counts check (Post vs Pre):"
          echo "  operational_shifts: $POST_0032_OP_SHIFTS vs $PRE_0032_OP_SHIFTS"
          echo "  hr_staff: $POST_0032_HR_STAFF vs $PRE_0032_HR_STAFF"
          echo "  hr_manpower_sanctions: $POST_0032_HR_MANPOWER vs $PRE_0032_HR_MANPOWER"
          echo "  hr_roster_assignments: $POST_0032_HR_ROSTER vs $PRE_0032_HR_ROSTER"
          echo "  hr_attendance_records: $POST_0032_HR_ATTENDANCE vs $PRE_0032_HR_ATTENDANCE"
          echo "  hr_nozzle_assignments: $POST_0032_HR_NOZZLE vs $PRE_0032_HR_NOZZLE"

          if [ "$POST_0032_OP_SHIFTS" -lt "$PRE_0032_OP_SHIFTS" ]; then echo "ERROR: [0032] operational_shifts count decreased from $PRE_0032_OP_SHIFTS to $POST_0032_OP_SHIFTS"; exit 1; fi
          if [ "$POST_0032_HR_STAFF" -lt "$PRE_0032_HR_STAFF" ]; then echo "ERROR: [0032] hr_staff count decreased from $PRE_0032_HR_STAFF to $POST_0032_HR_STAFF"; exit 1; fi
          if [ "$POST_0032_HR_MANPOWER" -lt "$PRE_0032_HR_MANPOWER" ]; then echo "ERROR: [0032] hr_manpower_sanctions count decreased from $PRE_0032_HR_MANPOWER to $POST_0032_HR_MANPOWER"; exit 1; fi
          if [ "$POST_0032_HR_ROSTER" -lt "$PRE_0032_HR_ROSTER" ]; then echo "ERROR: [0032] hr_roster_assignments count decreased from $PRE_0032_HR_ROSTER to $POST_0032_HR_ROSTER"; exit 1; fi
          if [ "$POST_0032_HR_ATTENDANCE" -lt "$PRE_0032_HR_ATTENDANCE" ]; then echo "ERROR: [0032] hr_attendance_records count decreased from $PRE_0032_HR_ATTENDANCE to $POST_0032_HR_ATTENDANCE"; exit 1; fi
          if [ "$POST_0032_HR_NOZZLE" -lt "$PRE_0032_HR_NOZZLE" ]; then echo "ERROR: [0032] hr_nozzle_assignments count decreased from $PRE_0032_HR_NOZZLE to $POST_0032_HR_NOZZLE"; exit 1; fi

          echo "[0032] Running foreign key check..."
          FK_RESULT_0032=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "PRAGMA foreign_key_check;" \
            --json \
            --yes)
          FK_VIOLATIONS_0032=$(echo "$FK_RESULT_0032" | jq -r '.[0].results | length')
          if [ "$FK_VIOLATIONS_0032" != "0" ]; then
            echo "ERROR: [0032] Foreign key violation detected post-migration 0032:"
            echo "$FK_RESULT_0032"
            exit 1
          fi
          echo "[0032] PRAGMA foreign_key_check passed (0 violations)."

          # 7. CHECK REFERENCES
          echo "[0032] Checking references to global masters..."
          ORPHAN_DESIG_COUNT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM hr_staff s LEFT JOIN global_hr_designations g ON s.designation_id = g.id WHERE g.id IS NULL;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          ORPHAN_SHIFT_COUNT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM operational_shifts os LEFT JOIN global_shift_templates g ON os.shift_template_id = g.id WHERE g.id IS NULL;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          echo "[0032] Orphan reference counts: hr_staff -> global_hr_designations: $ORPHAN_DESIG_COUNT, operational_shifts -> global_shift_templates: $ORPHAN_SHIFT_COUNT"

          if [ "$ORPHAN_DESIG_COUNT" != "0" ]; then
            echo "ERROR: [0032] Found $ORPHAN_DESIG_COUNT hr_staff records referencing missing global_hr_designations."
            exit 1
          fi

          if [ "$ORPHAN_SHIFT_COUNT" != "0" ]; then
            echo "ERROR: [0032] Found $ORPHAN_SHIFT_COUNT operational_shifts records referencing missing global_shift_templates."
            exit 1
          fi
          echo "[0032] Reference integrity verified (all orphan counts 0)."

          # 8. RECORD MIGRATION
          echo "[0032] Recording migration $MIGRATION_0032 in d1_migrations..."
          npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "INSERT OR IGNORE INTO d1_migrations (name) VALUES ('$MIGRATION_0032');" \
            --yes

          echo "[0032] Migration $MIGRATION_0032 successfully applied and recorded."


      - name: Verify D1 Migration Completion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT id, name, applied_at FROM d1_migrations ORDER BY id;" \
            --yes

          RESULT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM d1_migrations;" \
            --json \
            --yes)

          COUNT=$(echo "$RESULT" | jq -r '.[0].results[0].count // 0')

          echo "Recorded migrations: $COUNT"

          if [ "$COUNT" -lt "32" ]; then
            echo "ERROR: Expected all 32 migrations to be recorded."
            exit 1
          fi

          # Explicit workflow assertions for global masters
          GLOBAL_TABLES_CHECK=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('global_hr_designations', 'global_shift_templates');" \
            --json \
            --yes)
          FOUND_GLOBAL_COUNT=$(echo "$GLOBAL_TABLES_CHECK" | jq -r '.[0].results | length')
          if [ "$FOUND_GLOBAL_COUNT" -ne 2 ]; then
            echo "ERROR: One or more global master tables are missing from sqlite_master (found $FOUND_GLOBAL_COUNT / 2)."
            exit 1
          fi

          LEGACY_SHIFT_COUNT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM shift_templates;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          GLOBAL_SHIFT_COUNT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM global_shift_templates;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          if [ "$LEGACY_SHIFT_COUNT" -gt 0 ] && [ "$GLOBAL_SHIFT_COUNT" -eq 0 ]; then
            echo "ERROR: global_shift_templates has 0 records when legacy shift_templates had $LEGACY_SHIFT_COUNT records."
            exit 1
          fi

          echo "Global masters migration assertions verified successfully."

      - name: Verify Remote DG and Report Permission Integrity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== VERIFYING REMOTE DG & REPORT PERMISSIONS ==="

          PERMS_RES=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT code FROM permissions WHERE code IN ('dg_log.read', 'dg_log.write', 'reports.read', 'reports.generate');" \
            --json \
            --yes)

          PERM_COUNT=$(echo "$PERMS_RES" | jq -r '.[0].results | length')
          echo "Found permission codes count: $PERM_COUNT (expected 4)"

          if [ "$PERM_COUNT" -lt "4" ]; then
            echo "ERROR: One or more required permission codes (dg_log.read, dg_log.write, reports.read, reports.generate) are missing."
            exit 1
          fi

          GEN_PERMS_RES=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT r.code AS role_code FROM role_permissions rp JOIN roles r ON rp.role_id = r.id JOIN permissions p ON rp.permission_id = p.id WHERE p.code = 'reports.generate';" \
            --json \
            --yes)

          HAS_SO=$(echo "$GEN_PERMS_RES" | jq -r '.[0].results | map(select(.role_code == "STATE_OFFICE")) | length')
          HAS_DO=$(echo "$GEN_PERMS_RES" | jq -r '.[0].results | map(select(.role_code == "DIVISIONAL_OFFICE")) | length')
          HAS_BM=$(echo "$GEN_PERMS_RES" | jq -r '.[0].results | map(select(.role_code == "BUSINESS_MANAGER")) | length')
          HAS_FO=$(echo "$GEN_PERMS_RES" | jq -r '.[0].results | map(select(.role_code == "FIELD_OFFICER")) | length')
          HAS_DLR=$(echo "$GEN_PERMS_RES" | jq -r '.[0].results | map(select(.role_code == "DEALER")) | length')
          HAS_CSP=$(echo "$GEN_PERMS_RES" | jq -r '.[0].results | map(select(.role_code == "CSP")) | length')

          echo "reports.generate role mapping checks: SO=$HAS_SO, DO=$HAS_DO, BM=$HAS_BM, FO=$HAS_FO, DEALER=$HAS_DLR, CSP=$HAS_CSP"

          if [ "$HAS_SO" -eq 0 ] || [ "$HAS_DO" -eq 0 ] || [ "$HAS_BM" -eq 0 ] || [ "$HAS_FO" -eq 0 ] || [ "$HAS_DLR" -eq 0 ]; then
            echo "ERROR: One or more supervisory or dealer roles are missing reports.generate permission."
            exit 1
          fi

          if [ "$HAS_CSP" -gt 0 ]; then
            echo "ERROR: CSP role unexpectedly has reports.generate permission."
            exit 1
          fi

          echo "Remote DG and Report permissions verified successfully."

      - name: Verify Phase 4 HR Skill Category Integrity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
