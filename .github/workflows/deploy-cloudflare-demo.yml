          fi

      - name: Verify Phase 3 Fuel Topology Integrity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== VERIFYING PHASE 3 PHYSICAL FUEL TOPOLOGY INTEGRITY ==="

          # 0. Inspect & safely reconcile Outlet 396187 (COCO 22) MPD #1 / Nozzle #2 if orphaned or unsynchronized
          echo "Inspecting Outlet 396187 (COCO 22) MPD #1 nozzle topology..."
          npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "
              UPDATE nozzles
              SET
                outlet_id = (SELECT d.outlet_id FROM dispensers d WHERE d.id = nozzles.dispenser_id),
                tank_id = COALESCE(
                  (SELECT t.id FROM tanks t WHERE t.id = nozzles.tank_id AND t.outlet_id = (SELECT d.outlet_id FROM dispensers d WHERE d.id = nozzles.dispenser_id)),
                  (SELECT t.id FROM tanks t WHERE t.outlet_id = (SELECT d.outlet_id FROM dispensers d WHERE d.id = nozzles.dispenser_id) AND t.product_id = nozzles.product_id AND t.status = 'ACTIVE' ORDER BY t.tank_number ASC LIMIT 1),
                  (SELECT n2.tank_id FROM nozzles n2 JOIN tanks t2 ON n2.tank_id = t2.id WHERE n2.dispenser_id = nozzles.dispenser_id AND n2.id != nozzles.id GROUP BY n2.tank_id ORDER BY COUNT(*) ASC, MIN(n2.nozzle_number) ASC LIMIT 1)
                ),
                product_id = COALESCE(
                  (SELECT p.id FROM products p WHERE p.id = nozzles.product_id),
                  (SELECT t.product_id FROM tanks t WHERE t.id = nozzles.tank_id),
                  (SELECT n2.product_id FROM nozzles n2 JOIN products p2 ON n2.product_id = p2.id WHERE n2.dispenser_id = nozzles.dispenser_id AND n2.id != nozzles.id GROUP BY n2.product_id ORDER BY COUNT(*) ASC, MIN(n2.nozzle_number) ASC LIMIT 1)
                ),
                status = 'ACTIVE',
                updated_at = strftime('%Y-%m-%dT%H:%M:%SZ', 'now')
              WHERE dispenser_id IN (
                SELECT d.id FROM dispensers d
                JOIN retail_outlets ro ON d.outlet_id = ro.id
                WHERE (ro.ro_code = '396187' OR ro.name LIKE '%COCO 22%') AND d.dispenser_number = 1
              )
              AND nozzle_number = 2
              AND (
                outlet_id != (SELECT d.outlet_id FROM dispensers d WHERE d.id = nozzles.dispenser_id)
                OR NOT EXISTS (SELECT 1 FROM products p WHERE p.id = nozzles.product_id)
                OR NOT EXISTS (SELECT 1 FROM tanks t WHERE t.id = nozzles.tank_id AND t.outlet_id = nozzles.outlet_id AND t.product_id = nozzles.product_id)
              );

              INSERT OR IGNORE INTO nozzles (
                id, outlet_id, dispenser_id, nozzle_number, product_id, tank_id, status, created_at, updated_at, created_by
              )
              SELECT
                'noz-396187-mpd1-n2',
                d.outlet_id,
                d.id,
                2,
                candidate.product_id,
                candidate.tank_id,
                'ACTIVE',
                strftime('%Y-%m-%dT%H:%M:%SZ', 'now'),
                strftime('%Y-%m-%dT%H:%M:%SZ', 'now'),
                COALESCE(d.created_by, 'usr-admin-1')
              FROM dispensers d
              JOIN retail_outlets ro ON d.outlet_id = ro.id
              JOIN (
                SELECT n.dispenser_id, n.product_id, n.tank_id
                FROM nozzles n
                JOIN products p ON n.product_id = p.id
                JOIN tanks t ON n.tank_id = t.id AND t.outlet_id = n.outlet_id AND t.product_id = n.product_id
                GROUP BY n.dispenser_id, n.product_id, n.tank_id
                ORDER BY COUNT(*) ASC, MIN(n.nozzle_number) ASC
                LIMIT 1
              ) candidate ON candidate.dispenser_id = d.id
              WHERE (ro.ro_code = '396187' OR ro.name LIKE '%COCO 22%')
                AND d.dispenser_number = 1
                AND d.nozzle_capacity >= 2
                AND NOT EXISTS (
                  SELECT 1 FROM nozzles n_existing
                  WHERE n_existing.dispenser_id = d.id AND n_existing.nozzle_number = 2
                )
                AND (
                  SELECT COUNT(*) FROM nozzles n_sib
                  WHERE n_sib.dispenser_id = d.id AND n_sib.nozzle_number IN (1, 3, 4)
                ) = 3;
            " \
            --yes

          # A. nozzle_number < 1 OR nozzle_number > dispenser.nozzle_capacity
          CAPACITY_VIOLATIONS=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM nozzles n JOIN dispensers d ON n.dispenser_id = d.id WHERE n.nozzle_number < 1 OR n.nozzle_number > d.nozzle_capacity;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          # B. nozzle.outlet_id != dispenser.outlet_id
          DISP_OUTLET_VIOLATIONS=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM nozzles n JOIN dispensers d ON n.dispenser_id = d.id WHERE n.outlet_id != d.outlet_id;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          # C. nozzle.outlet_id != tank.outlet_id
          TANK_OUTLET_VIOLATIONS=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM nozzles n JOIN tanks t ON n.tank_id = t.id WHERE n.outlet_id != t.outlet_id;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          # D. nozzle.product_id != tank.product_id
          PRODUCT_VIOLATIONS=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM nozzles n JOIN tanks t ON n.tank_id = t.id WHERE n.product_id != t.product_id;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          # E. Orphan nozzles (LEFT JOIN check for missing dispenser, product, or tank)
          ORPHAN_NOZZLE_VIOLATIONS=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM nozzles n LEFT JOIN dispensers d ON n.dispenser_id = d.id LEFT JOIN products p ON n.product_id = p.id LEFT JOIN tanks t ON n.tank_id = t.id WHERE d.id IS NULL OR p.id IS NULL OR t.id IS NULL;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          echo "Topology Violations: Capacity=$CAPACITY_VIOLATIONS, DispenserOutlet=$DISP_OUTLET_VIOLATIONS, TankOutlet=$TANK_OUTLET_VIOLATIONS, TankProduct=$PRODUCT_VIOLATIONS, OrphanNozzles=$ORPHAN_NOZZLE_VIOLATIONS"

          TOPOLOGY_FAILED=0
          if [ "$CAPACITY_VIOLATIONS" -gt 0 ]; then
            echo "ERROR: Remote database contains $CAPACITY_VIOLATIONS nozzle(s) violating DU nozzle_capacity limits."
            TOPOLOGY_FAILED=1
          fi

          if [ "$DISP_OUTLET_VIOLATIONS" -gt 0 ]; then
            echo "ERROR: Remote database contains $DISP_OUTLET_VIOLATIONS nozzle(s) with mismatched dispenser outlet IDs."
            TOPOLOGY_FAILED=1
          fi

          if [ "$TANK_OUTLET_VIOLATIONS" -gt 0 ]; then
            echo "ERROR: Remote database contains $TANK_OUTLET_VIOLATIONS nozzle(s) with mismatched tank outlet IDs."
            TOPOLOGY_FAILED=1
          fi

          if [ "$PRODUCT_VIOLATIONS" -gt 0 ]; then
            echo "ERROR: Remote database contains $PRODUCT_VIOLATIONS nozzle(s) with mismatched tank product IDs."
            TOPOLOGY_FAILED=1
          fi

          if [ "$ORPHAN_NOZZLE_VIOLATIONS" -gt 0 ]; then
            echo "ERROR: Remote database contains $ORPHAN_NOZZLE_VIOLATIONS orphan nozzle(s) failing LEFT JOIN topology checks."
            TOPOLOGY_FAILED=1
          fi

          if [ "$TOPOLOGY_FAILED" -ne 0 ]; then
            echo "CRITICAL: Physical fuel topology verification failed. Halting deployment."
            exit 1
          fi
          echo "Physical fuel topology integrity verified successfully (all counts 0)."

      - name: Verify Retail Outlet Directory Visibility Integrity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== VERIFYING RETAIL OUTLET DIRECTORY VISIBILITY INTEGRITY ==="

          INVALID_VISIBILITY_VAL=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM retail_outlets WHERE directory_hidden NOT IN (0, 1);" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          METADATA_INCONSISTENCY=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM retail_outlets WHERE directory_hidden = 0 AND (directory_hidden_at IS NOT NULL OR directory_hidden_by IS NOT NULL);" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          echo "Invalid Directory Visibility Value Violations: $INVALID_VISIBILITY_VAL"
          echo "Metadata Inconsistency Violations: $METADATA_INCONSISTENCY"

          if [ "$INVALID_VISIBILITY_VAL" -gt 0 ] || [ "$METADATA_INCONSISTENCY" -gt 0 ]; then
            echo "ERROR: Retail outlet directory visibility integrity validation failed."
            exit 1
          fi
          echo "Retail outlet directory visibility integrity verified successfully (all counts 0)."

      - name: Capture Post-Migration Counts & Verify Row Count Safety
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== CAPTURING POST-MIGRATION TABLE COUNTS & VALIDATING ==="
          POST_TABLES_RESULT=$(npx wrangler d1 execute iocl-pump-manager-d1 --remote --command "SELECT name FROM sqlite_master WHERE type='table';" --json --yes)

          FAILED=0
          TABLES=(
            "users"
            "retail_outlets"
            "products"
            "outlet_products"
            "tanks"
            "dispensers"
            "nozzles"
            "operational_shifts"
            "nozzle_meter_readings"
            "tank_stock_readings"
            "fuel_receipts"
            "fuel_receipt_tank_lines"
            "outlet_product_prices"
            "credit_parties"
            "credit_parties_v2"
            "shift_collections"
            "shift_collections_v2"
            "cash_handover_logs"
            "cash_handover_logs_v2"
            "bank_deposits"
            "bank_deposits_v2"
            "shift_financial_reconciliations"
            "cng_shift_logs"
            "cng_pressure_readings"
            "lube_skus"
            "lube_sku_prices"
            "lube_stock_transactions"
            "lube_shift_sales"
            "equipment_assets"
            "equipment_breakdown_tickets"
            "equipment_breakdown_events"
            "dg_daily_logs"
            "dg_run_intervals"
            "utility_electricity_accounts"
            "utility_electricity_bills"
            "utility_sub_meters"
            "utility_sub_meter_readings"
            "municipal_tax_dues"
            "nfr_spaces"
            "nfr_vendors"
            "nfr_leases"
            "nfr_rent_dues"
            "nfr_rent_payments"
            "hr_designations"
            "hr_staff"
            "hr_manpower_sanctions"
            "hr_roster_assignments"
            "hr_attendance_records"
            "hr_outlet_geofence_policies"
            "hr_nozzle_assignments"
            "hr_uniform_items"
            "hr_uniform_variants"
            "hr_uniform_stock_transactions"
            "hr_uniform_issues"
            "hr_leave_requests"
            "org_departments"
            "org_officers"
            "org_officer_postings"
            "service_providers"
            "outlet_service_provider_assignments"
            "user_permission_overrides"
            "documents"
            "audit_logs"
          )

          for T in "${TABLES[@]}"; do
            if [ -f ".d1_counts/pre_$T.txt" ]; then
              PRE_CNT=$(cat ".d1_counts/pre_$T.txt")
              
              EXISTS=$(echo "$POST_TABLES_RESULT" | jq --arg t "$T" '.[0].results | map(select(.name == $t)) | length')
              if [ "$EXISTS" -eq 0 ]; then
                echo "ERROR: Table $T existed pre-migration but is missing post-migration!"
                FAILED=1
                continue
              fi

              POST_RES=$(npx wrangler d1 execute iocl-pump-manager-d1 --remote --command "SELECT COUNT(*) AS count FROM $T;" --json --yes)
              POST_CNT=$(echo "$POST_RES" | jq -r '.[0].results[0].count // 0')
              echo "Post-migration count for $T: $POST_CNT (Pre: $PRE_CNT)"

              if [ "$POST_CNT" -lt "$PRE_CNT" ]; then
                echo "ERROR: Table $T row count decreased from $PRE_CNT to $POST_CNT!"
                FAILED=1
              fi
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "DEPLOYMENT SAFETY FAILED: One or more operational tables experienced a decrease in row count."
            exit 1
          fi
          echo "Row count safety check PASSED (Post >= Pre for all protected tables)."

      - name: Verify Production Admin Existence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          ADMIN_RESULT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM users WHERE email = 'admin@iocl.in';" \
            --json \
            --yes)

          ADMIN_COUNT=$(echo "$ADMIN_RESULT" | jq -r '.[0].results[0].count // 0')

          echo "Production admin count: $ADMIN_COUNT"

          if [ "$ADMIN_COUNT" != "1" ]; then
            echo "ERROR: Production admin account (admin@iocl.in) not found or count is not 1."
            exit 1
          fi

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
