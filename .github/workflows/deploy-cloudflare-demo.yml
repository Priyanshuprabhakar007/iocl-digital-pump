name: Deploy Cloudflare Demo

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Typecheck, Test, Build & Deploy to Cloudflare
    runs-on: ubuntu-latest

    steps:
      - name: Workflow Warning Banner
        run: |
          echo "=================================================="
          echo "PRODUCTION DATA SAFETY MODE:"
          echo "Remote demo seeding is disabled."
          echo "Existing D1 operational data will be preserved."
          echo "=================================================="

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Typecheck
        run: bun run typecheck

      - name: Run Test Suite
        run: bun test

      - name: Build Frontend Assets
        run: bun run build

      - name: Verify Base D1 Migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          RESULT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM d1_migrations WHERE name = '0013_cng_financial_integration.sql';" \
            --json \
            --yes)

          COUNT=$(echo "$RESULT" | jq -r '.[0].results[0].count // 0')

          echo "0013 migration recorded: $COUNT"

          if [ "$COUNT" != "1" ]; then
            echo "ERROR: Expected migration 0013 to be applied before the trigger migration compatibility path."
            exit 1
          fi

      - name: Capture Pre-Migration Operational Data Counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== CAPTURING PRE-MIGRATION TABLE COUNTS ==="
          mkdir -p .d1_counts
          TABLES=(
            "users"
            "retail_outlets"
            "products"
            "outlet_products"
            "tanks"
            "dispensers"
            "nozzles"
            "operational_shifts"
            "nozzle_meter_readings"
            "tank_stock_readings"
            "fuel_receipts"
            "fuel_receipt_tank_lines"
            "outlet_product_prices"
            "credit_parties"
            "credit_parties_v2"
            "shift_collections"
            "shift_collections_v2"
            "cash_handover_logs"
            "cash_handover_logs_v2"
            "bank_deposits"
            "bank_deposits_v2"
            "shift_financial_reconciliations"
            "cng_shift_logs"
            "cng_pressure_readings"
            "lube_skus"
            "lube_sku_prices"
            "lube_stock_transactions"
            "lube_shift_sales"
            "equipment_assets"
            "equipment_breakdown_tickets"
            "equipment_breakdown_events"
            "dg_daily_logs"
            "dg_run_intervals"
            "utility_electricity_accounts"
            "utility_electricity_bills"
            "utility_sub_meters"
            "utility_sub_meter_readings"
            "municipal_tax_dues"
            "nfr_spaces"
            "nfr_vendors"
            "nfr_leases"
            "nfr_rent_dues"
            "nfr_rent_payments"
            "hr_designations"
            "hr_staff"
            "hr_manpower_sanctions"
            "hr_roster_assignments"
            "hr_attendance_records"
            "hr_outlet_geofence_policies"
            "hr_nozzle_assignments"
            "hr_uniform_items"
            "hr_uniform_variants"
            "hr_uniform_stock_transactions"
            "hr_uniform_issues"
            "hr_leave_requests"
            "org_departments"
            "org_officers"
            "org_officer_postings"
            "service_providers"
            "outlet_service_provider_assignments"
            "user_permission_overrides"
            "documents"
            "audit_logs"
          )

          TABLES_RESULT=$(npx wrangler d1 execute iocl-pump-manager-d1 --remote --command "SELECT name FROM sqlite_master WHERE type='table';" --json --yes)

          for T in "${TABLES[@]}"; do
            EXISTS=$(echo "$TABLES_RESULT" | jq --arg t "$T" '.[0].results | map(select(.name == $t)) | length')
            if [ "$EXISTS" -gt 0 ]; then
              CNT_RES=$(npx wrangler d1 execute iocl-pump-manager-d1 --remote --command "SELECT COUNT(*) AS count FROM $T;" --json --yes)
              CNT=$(echo "$CNT_RES" | jq -r '.[0].results[0].count // 0')
              echo "$CNT" > ".d1_counts/pre_$T.txt"
              echo "Pre-migration count for $T: $CNT"
            else
              echo "Table $T does not exist yet pre-migration."
            fi
          done

      - name: Apply Trigger Migrations via D1 Import
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          MIGRATIONS=(
            "migrations/0014_phase3b_lube_operations.sql"
            "migrations/0015_phase3c_equipment_breakdowns.sql"
            "migrations/0016_phase4a_utilities.sql"
            "migrations/0017_phase4b_municipal_taxes.sql"
            "migrations/0018_phase4c_nfr_leases_rent.sql"
            "migrations/0019_phase5a_workforce_roster.sql"
            "migrations/0020_phase5b_attendance_geofence_nozzle_assignments.sql"
            "migrations/0021_phase5c_uniform_management.sql"
            "migrations/0022_user_permission_overrides.sql"
            "migrations/0023_org_officer_service_provider.sql"
            "migrations/0024_phase3_du_nozzle_capacity.sql"
            "migrations/0025_phase4_hr_skill_categories.sql"
            "migrations/0026_phase5a_hr_leave_maker_checker.sql"
            "migrations/0027_outlet_directory_visibility.sql"
            "migrations/0028_dg_daily_operations_reporting.sql"
            "migrations/0029_dg_report_permissions.sql"
            "migrations/0030_outlet_archive_lifecycle.sql"
            "migrations/0031_idempotency_and_unique_constraints.sql"
          )

          for FILE in "${MIGRATIONS[@]}"; do
            NAME=$(basename "$FILE")

            echo "Checking migration: $NAME"

            RESULT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
              --remote \
              --command "SELECT COUNT(*) AS count FROM d1_migrations WHERE name = '$NAME';" \
              --json \
              --yes)

            COUNT=$(echo "$RESULT" | jq -r '.[0].results[0].count // 0')

            if [ "$COUNT" = "1" ]; then
              echo "Already applied: $NAME"
              continue
            fi

            echo "Applying through D1 file import: $NAME"

            npx wrangler d1 execute iocl-pump-manager-d1 \
              --remote \
              --file="$FILE" \
              --yes

            echo "Recording migration: $NAME"

            npx wrangler d1 execute iocl-pump-manager-d1 \
              --remote \
              --command "INSERT OR IGNORE INTO d1_migrations (name) VALUES ('$NAME');" \
              --yes

            echo "Completed: $NAME"
          done

      - name: Verify D1 Migration Completion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT id, name, applied_at FROM d1_migrations ORDER BY id;" \
            --yes

          RESULT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM d1_migrations;" \
            --json \
            --yes)

          COUNT=$(echo "$RESULT" | jq -r '.[0].results[0].count // 0')

          echo "Recorded migrations: $COUNT"

          if [ "$COUNT" -lt "31" ]; then
            echo "ERROR: Expected all 31 migrations to be recorded."
            exit 1
          fi

      - name: Verify Remote DG and Report Permission Integrity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== VERIFYING REMOTE DG & REPORT PERMISSIONS ==="

          PERMS_RES=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT code FROM permissions WHERE code IN ('dg_log.read', 'dg_log.write', 'reports.read', 'reports.generate');" \
            --json \
            --yes)

          PERM_COUNT=$(echo "$PERMS_RES" | jq -r '.[0].results | length')
          echo "Found permission codes count: $PERM_COUNT (expected 4)"

          if [ "$PERM_COUNT" -lt "4" ]; then
            echo "ERROR: One or more required permission codes (dg_log.read, dg_log.write, reports.read, reports.generate) are missing."
            exit 1
          fi

          GEN_PERMS_RES=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT r.code AS role_code FROM role_permissions rp JOIN roles r ON rp.role_id = r.id JOIN permissions p ON rp.permission_id = p.id WHERE p.code = 'reports.generate';" \
            --json \
            --yes)

          HAS_SO=$(echo "$GEN_PERMS_RES" | jq -r '.[0].results | map(select(.role_code == "STATE_OFFICE")) | length')
          HAS_DO=$(echo "$GEN_PERMS_RES" | jq -r '.[0].results | map(select(.role_code == "DIVISIONAL_OFFICE")) | length')
          HAS_BM=$(echo "$GEN_PERMS_RES" | jq -r '.[0].results | map(select(.role_code == "BUSINESS_MANAGER")) | length')
          HAS_FO=$(echo "$GEN_PERMS_RES" | jq -r '.[0].results | map(select(.role_code == "FIELD_OFFICER")) | length')
          HAS_DLR=$(echo "$GEN_PERMS_RES" | jq -r '.[0].results | map(select(.role_code == "DEALER")) | length')
          HAS_CSP=$(echo "$GEN_PERMS_RES" | jq -r '.[0].results | map(select(.role_code == "CSP")) | length')

          echo "reports.generate role mapping checks: SO=$HAS_SO, DO=$HAS_DO, BM=$HAS_BM, FO=$HAS_FO, DEALER=$HAS_DLR, CSP=$HAS_CSP"

          if [ "$HAS_SO" -eq 0 ] || [ "$HAS_DO" -eq 0 ] || [ "$HAS_BM" -eq 0 ] || [ "$HAS_FO" -eq 0 ] || [ "$HAS_DLR" -eq 0 ]; then
            echo "ERROR: One or more supervisory or dealer roles are missing reports.generate permission."
            exit 1
          fi

          if [ "$HAS_CSP" -gt 0 ]; then
            echo "ERROR: CSP role unexpectedly has reports.generate permission."
            exit 1
          fi

          echo "Remote DG and Report permissions verified successfully."

      - name: Verify Phase 4 HR Skill Category Integrity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== VERIFYING PHASE 4 HR SKILL CATEGORY INTEGRITY ==="

          INVALID_SKILL_VIOLATIONS=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM hr_designations WHERE skill_category IS NOT NULL AND skill_category NOT IN ('HIGHLY_SKILLED', 'SKILLED', 'SEMI_SKILLED', 'UNSKILLED');" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          echo "Invalid HR Skill Category Violations: $INVALID_SKILL_VIOLATIONS"

          if [ "$INVALID_SKILL_VIOLATIONS" -gt 0 ]; then
            echo "ERROR: Remote database contains $INVALID_SKILL_VIOLATIONS designation(s) with invalid skill_category."
            exit 1
          fi
          echo "HR skill category integrity verified successfully (all counts 0)."

      - name: Verify Phase 5A HR Leave Integrity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== VERIFYING PHASE 5A HR LEAVE INTEGRITY ==="

          INVALID_STATUS_COUNT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM hr_leave_requests WHERE status NOT IN ('PENDING', 'APPROVED', 'REJECTED', 'CANCELLED');" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          SELF_APPROVED_COUNT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM hr_leave_requests WHERE status IN ('APPROVED', 'REJECTED') AND decision_by_user_id = requested_by_user_id;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          # Detect invalid workflow metadata for PENDING, APPROVED, REJECTED, CANCELLED
          STATE_CONSISTENCY_VIOLATIONS=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM hr_leave_requests WHERE (status = 'PENDING' AND (decision_by_user_id IS NOT NULL OR decision_at IS NOT NULL OR cancelled_by_user_id IS NOT NULL OR cancelled_at IS NOT NULL)) OR (status = 'APPROVED' AND (decision_by_user_id IS NULL OR decision_at IS NULL OR cancelled_by_user_id IS NOT NULL OR cancelled_at IS NOT NULL)) OR (status = 'REJECTED' AND (decision_by_user_id IS NULL OR decision_at IS NULL OR decision_notes IS NULL OR cancelled_by_user_id IS NOT NULL OR cancelled_at IS NOT NULL)) OR (status = 'CANCELLED' AND (decision_by_user_id IS NOT NULL OR decision_at IS NOT NULL OR cancelled_by_user_id IS NULL OR cancelled_at IS NULL OR cancellation_reason IS NULL));" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          # Active overlap violations
          ACTIVE_OVERLAP_VIOLATIONS=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM hr_leave_requests a JOIN hr_leave_requests b ON a.staff_id = b.staff_id AND a.id < b.id WHERE a.status IN ('PENDING', 'APPROVED') AND b.status IN ('PENDING', 'APPROVED') AND a.to_date >= b.from_date AND a.from_date <= b.to_date;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          echo "Invalid Status Count: $INVALID_STATUS_COUNT, Self-Approved Count: $SELF_APPROVED_COUNT, State Consistency Violations: $STATE_CONSISTENCY_VIOLATIONS, Active Overlap Violations: $ACTIVE_OVERLAP_VIOLATIONS"

          if [ "$INVALID_STATUS_COUNT" -gt 0 ] || [ "$SELF_APPROVED_COUNT" -gt 0 ] || [ "$STATE_CONSISTENCY_VIOLATIONS" -gt 0 ] || [ "$ACTIVE_OVERLAP_VIOLATIONS" -gt 0 ]; then
            echo "ERROR: HR Leave integrity violation detected."
            exit 1
          fi
          echo "HR Leave integrity verified successfully."

      - name: Verify Foreign Key Constraints
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          FK_RESULT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "PRAGMA foreign_key_check;" \
            --json \
            --yes)

          FK_COUNT=$(echo "$FK_RESULT" | jq '.[0].results | length')

          echo "Foreign key violations: $FK_COUNT"

          if [ "$FK_COUNT" != "0" ]; then
            echo "$FK_RESULT"
            echo "ERROR: Remote database contains foreign-key violations."
            exit 1
          fi

      - name: Verify Phase 3 Fuel Topology Integrity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== VERIFYING PHASE 3 PHYSICAL FUEL TOPOLOGY INTEGRITY ==="

          # 0. Inspect & safely reconcile Outlet 396187 (COCO 22) MPD #1 / Nozzle #2 if orphaned or unsynchronized
          echo "Inspecting Outlet 396187 (COCO 22) MPD #1 nozzle topology..."
          npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "
              UPDATE nozzles
              SET
                outlet_id = (SELECT d.outlet_id FROM dispensers d WHERE d.id = nozzles.dispenser_id),
                tank_id = COALESCE(
                  (SELECT t.id FROM tanks t WHERE t.id = nozzles.tank_id AND t.outlet_id = (SELECT d.outlet_id FROM dispensers d WHERE d.id = nozzles.dispenser_id)),
                  (SELECT t.id FROM tanks t WHERE t.outlet_id = (SELECT d.outlet_id FROM dispensers d WHERE d.id = nozzles.dispenser_id) AND t.product_id = nozzles.product_id AND t.status = 'ACTIVE' ORDER BY t.tank_number ASC LIMIT 1),
                  (SELECT n2.tank_id FROM nozzles n2 JOIN tanks t2 ON n2.tank_id = t2.id WHERE n2.dispenser_id = nozzles.dispenser_id AND n2.id != nozzles.id GROUP BY n2.tank_id ORDER BY COUNT(*) ASC, MIN(n2.nozzle_number) ASC LIMIT 1)
                ),
                product_id = COALESCE(
                  (SELECT p.id FROM products p WHERE p.id = nozzles.product_id),
                  (SELECT t.product_id FROM tanks t WHERE t.id = nozzles.tank_id),
                  (SELECT n2.product_id FROM nozzles n2 JOIN products p2 ON n2.product_id = p2.id WHERE n2.dispenser_id = nozzles.dispenser_id AND n2.id != nozzles.id GROUP BY n2.product_id ORDER BY COUNT(*) ASC, MIN(n2.nozzle_number) ASC LIMIT 1)
                ),
                status = 'ACTIVE',
                updated_at = strftime('%Y-%m-%dT%H:%M:%SZ', 'now')
              WHERE dispenser_id IN (
                SELECT d.id FROM dispensers d
                JOIN retail_outlets ro ON d.outlet_id = ro.id
                WHERE (ro.ro_code = '396187' OR ro.name LIKE '%COCO 22%') AND d.dispenser_number = 1
              )
              AND nozzle_number = 2
              AND (
                outlet_id != (SELECT d.outlet_id FROM dispensers d WHERE d.id = nozzles.dispenser_id)
                OR NOT EXISTS (SELECT 1 FROM products p WHERE p.id = nozzles.product_id)
                OR NOT EXISTS (SELECT 1 FROM tanks t WHERE t.id = nozzles.tank_id AND t.outlet_id = nozzles.outlet_id AND t.product_id = nozzles.product_id)
              );

              INSERT OR IGNORE INTO nozzles (
                id, outlet_id, dispenser_id, nozzle_number, product_id, tank_id, status, created_at, updated_at, created_by
              )
              SELECT
                'noz-396187-mpd1-n2',
                d.outlet_id,
                d.id,
                2,
                candidate.product_id,
                candidate.tank_id,
                'ACTIVE',
                strftime('%Y-%m-%dT%H:%M:%SZ', 'now'),
                strftime('%Y-%m-%dT%H:%M:%SZ', 'now'),
                COALESCE(d.created_by, 'usr-admin-1')
              FROM dispensers d
              JOIN retail_outlets ro ON d.outlet_id = ro.id
              JOIN (
                SELECT n.dispenser_id, n.product_id, n.tank_id
                FROM nozzles n
                JOIN products p ON n.product_id = p.id
                JOIN tanks t ON n.tank_id = t.id AND t.outlet_id = n.outlet_id AND t.product_id = n.product_id
                GROUP BY n.dispenser_id, n.product_id, n.tank_id
                ORDER BY COUNT(*) ASC, MIN(n.nozzle_number) ASC
                LIMIT 1
              ) candidate ON candidate.dispenser_id = d.id
              WHERE (ro.ro_code = '396187' OR ro.name LIKE '%COCO 22%')
                AND d.dispenser_number = 1
                AND d.nozzle_capacity >= 2
                AND NOT EXISTS (
                  SELECT 1 FROM nozzles n_existing
                  WHERE n_existing.dispenser_id = d.id AND n_existing.nozzle_number = 2
                )
                AND (
                  SELECT COUNT(*) FROM nozzles n_sib
                  WHERE n_sib.dispenser_id = d.id AND n_sib.nozzle_number IN (1, 3, 4)
                ) = 3;
            " \
            --yes

          # A. nozzle_number < 1 OR nozzle_number > dispenser.nozzle_capacity
          CAPACITY_VIOLATIONS=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM nozzles n JOIN dispensers d ON n.dispenser_id = d.id WHERE n.nozzle_number < 1 OR n.nozzle_number > d.nozzle_capacity;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          # B. nozzle.outlet_id != dispenser.outlet_id
          DISP_OUTLET_VIOLATIONS=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM nozzles n JOIN dispensers d ON n.dispenser_id = d.id WHERE n.outlet_id != d.outlet_id;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          # C. nozzle.outlet_id != tank.outlet_id
          TANK_OUTLET_VIOLATIONS=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM nozzles n JOIN tanks t ON n.tank_id = t.id WHERE n.outlet_id != t.outlet_id;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          # D. nozzle.product_id != tank.product_id
          PRODUCT_VIOLATIONS=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM nozzles n JOIN tanks t ON n.tank_id = t.id WHERE n.product_id != t.product_id;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          # E. Orphan nozzles (LEFT JOIN check for missing dispenser, product, or tank)
          ORPHAN_NOZZLE_VIOLATIONS=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM nozzles n LEFT JOIN dispensers d ON n.dispenser_id = d.id LEFT JOIN products p ON n.product_id = p.id LEFT JOIN tanks t ON n.tank_id = t.id WHERE d.id IS NULL OR p.id IS NULL OR t.id IS NULL;" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          echo "Topology Violations: Capacity=$CAPACITY_VIOLATIONS, DispenserOutlet=$DISP_OUTLET_VIOLATIONS, TankOutlet=$TANK_OUTLET_VIOLATIONS, TankProduct=$PRODUCT_VIOLATIONS, OrphanNozzles=$ORPHAN_NOZZLE_VIOLATIONS"

          TOPOLOGY_FAILED=0
          if [ "$CAPACITY_VIOLATIONS" -gt 0 ]; then
            echo "ERROR: Remote database contains $CAPACITY_VIOLATIONS nozzle(s) violating DU nozzle_capacity limits."
            TOPOLOGY_FAILED=1
          fi

          if [ "$DISP_OUTLET_VIOLATIONS" -gt 0 ]; then
            echo "ERROR: Remote database contains $DISP_OUTLET_VIOLATIONS nozzle(s) with mismatched dispenser outlet IDs."
            TOPOLOGY_FAILED=1
          fi

          if [ "$TANK_OUTLET_VIOLATIONS" -gt 0 ]; then
            echo "ERROR: Remote database contains $TANK_OUTLET_VIOLATIONS nozzle(s) with mismatched tank outlet IDs."
            TOPOLOGY_FAILED=1
          fi

          if [ "$PRODUCT_VIOLATIONS" -gt 0 ]; then
            echo "ERROR: Remote database contains $PRODUCT_VIOLATIONS nozzle(s) with mismatched tank product IDs."
            TOPOLOGY_FAILED=1
          fi

          if [ "$ORPHAN_NOZZLE_VIOLATIONS" -gt 0 ]; then
            echo "ERROR: Remote database contains $ORPHAN_NOZZLE_VIOLATIONS orphan nozzle(s) failing LEFT JOIN topology checks."
            TOPOLOGY_FAILED=1
          fi

          if [ "$TOPOLOGY_FAILED" -ne 0 ]; then
            echo "CRITICAL: Physical fuel topology verification failed. Halting deployment."
            exit 1
          fi
          echo "Physical fuel topology integrity verified successfully (all counts 0)."

      - name: Verify Retail Outlet Directory Visibility Integrity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== VERIFYING RETAIL OUTLET DIRECTORY VISIBILITY INTEGRITY ==="

          INVALID_VISIBILITY_VAL=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM retail_outlets WHERE directory_hidden NOT IN (0, 1);" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          METADATA_INCONSISTENCY=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM retail_outlets WHERE directory_hidden = 0 AND (directory_hidden_at IS NOT NULL OR directory_hidden_by IS NOT NULL);" \
            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          echo "Invalid Directory Visibility Value Violations: $INVALID_VISIBILITY_VAL"
          echo "Metadata Inconsistency Violations: $METADATA_INCONSISTENCY"

          if [ "$INVALID_VISIBILITY_VAL" -gt 0 ] || [ "$METADATA_INCONSISTENCY" -gt 0 ]; then
            echo "ERROR: Retail outlet directory visibility integrity validation failed."
            exit 1
          fi
          echo "Retail outlet directory visibility integrity verified successfully (all counts 0)."

      - name: Capture Post-Migration Counts & Verify Row Count Safety
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "=== CAPTURING POST-MIGRATION TABLE COUNTS & VALIDATING ==="
          POST_TABLES_RESULT=$(npx wrangler d1 execute iocl-pump-manager-d1 --remote --command "SELECT name FROM sqlite_master WHERE type='table';" --json --yes)

          FAILED=0
          TABLES=(
            "users"
            "retail_outlets"
            "products"
            "outlet_products"
            "tanks"
            "dispensers"
            "nozzles"
            "operational_shifts"
            "nozzle_meter_readings"
            "tank_stock_readings"
            "fuel_receipts"
            "fuel_receipt_tank_lines"
            "outlet_product_prices"
            "credit_parties"
            "credit_parties_v2"
            "shift_collections"
            "shift_collections_v2"
            "cash_handover_logs"
            "cash_handover_logs_v2"
            "bank_deposits"
            "bank_deposits_v2"
            "shift_financial_reconciliations"
            "cng_shift_logs"
            "cng_pressure_readings"
            "lube_skus"
            "lube_sku_prices"
            "lube_stock_transactions"
            "lube_shift_sales"
            "equipment_assets"
            "equipment_breakdown_tickets"
            "equipment_breakdown_events"
            "dg_daily_logs"
            "dg_run_intervals"
            "utility_electricity_accounts"
            "utility_electricity_bills"
            "utility_sub_meters"
            "utility_sub_meter_readings"
            "municipal_tax_dues"
            "nfr_spaces"
            "nfr_vendors"
            "nfr_leases"
            "nfr_rent_dues"
            "nfr_rent_payments"
            "hr_designations"
            "hr_staff"
            "hr_manpower_sanctions"
            "hr_roster_assignments"
            "hr_attendance_records"
            "hr_outlet_geofence_policies"
            "hr_nozzle_assignments"
            "hr_uniform_items"
            "hr_uniform_variants"
            "hr_uniform_stock_transactions"
            "hr_uniform_issues"
            "hr_leave_requests"
            "org_departments"
            "org_officers"
            "org_officer_postings"
            "service_providers"
            "outlet_service_provider_assignments"
            "user_permission_overrides"
            "documents"
            "audit_logs"
          )

          for T in "${TABLES[@]}"; do
            if [ -f ".d1_counts/pre_$T.txt" ]; then
              PRE_CNT=$(cat ".d1_counts/pre_$T.txt")
              
              EXISTS=$(echo "$POST_TABLES_RESULT" | jq --arg t "$T" '.[0].results | map(select(.name == $t)) | length')
              if [ "$EXISTS" -eq 0 ]; then
                echo "ERROR: Table $T existed pre-migration but is missing post-migration!"
                FAILED=1
                continue
              fi

              POST_RES=$(npx wrangler d1 execute iocl-pump-manager-d1 --remote --command "SELECT COUNT(*) AS count FROM $T;" --json --yes)
              POST_CNT=$(echo "$POST_RES" | jq -r '.[0].results[0].count // 0')
              echo "Post-migration count for $T: $POST_CNT (Pre: $PRE_CNT)"

              if [ "$POST_CNT" -lt "$PRE_CNT" ]; then
                echo "ERROR: Table $T row count decreased from $PRE_CNT to $POST_CNT!"
                FAILED=1
              fi
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo "DEPLOYMENT SAFETY FAILED: One or more operational tables experienced a decrease in row count."
            exit 1
          fi
          echo "Row count safety check PASSED (Post >= Pre for all protected tables)."

      - name: Verify Production Admin Existence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          ADMIN_RESULT=$(npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --command "SELECT COUNT(*) AS count FROM users WHERE email = 'admin@iocl.in';" \
            --json \
            --yes)

          ADMIN_COUNT=$(echo "$ADMIN_RESULT" | jq -r '.[0].results[0].count // 0')

          echo "Production admin count: $ADMIN_COUNT"

          if [ "$ADMIN_COUNT" != "1" ]; then
            echo "ERROR: Production admin account (admin@iocl.in) not found or count is not 1."
            exit 1
          fi

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
