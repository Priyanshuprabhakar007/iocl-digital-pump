            --json \
            --yes | jq -r '.[0].results[0].count // 0')

          echo "Invalid HR Skill Category Violations: $INVALID_SKILL_VIOLATIONS"

          if [ "$INVALID_SKILL_VIOLATIONS" -gt 0 ]; then
            echo "ERROR: Remote database contains $INVALID_SKILL_VIOLATIONS designation(s) with invalid skill_category."
            exit 1
          fi
