name: Bootstrap Cloudflare Demo Database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type BOOTSTRAP_DEMO to confirm resetting/bootstrapping demo database'
        required: true
        type: string

jobs:
  bootstrap:
    name: Bootstrap Demo Database (NEW / EMPTY ONLY)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Confirm Input
        run: |
          if [ "${{ inputs.confirmation }}" != "BOOTSTRAP_DEMO" ]; then
            echo "ERROR: Confirmation input must be exactly 'BOOTSTRAP_DEMO'. Aborting."
            exit 1
          fi
          echo "Bootstrap confirmation accepted."

      - name: Export Demo Seed SQL
        run: bun run db:export-demo-seed

      - name: Apply Migrations & Seed Remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Executing demo seed script against remote D1..."
          npx wrangler d1 execute iocl-pump-manager-d1 \
            --remote \
            --file=demo-seed.sql \
            --yes
