name: Activate Approved COCO Lease Terms 0037

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-coco-lease-0037.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iocl-production-lease-terms-0037
  cancel-in-progress: false

jobs:
  activate:
    name: Local 0036+0037 rehearsal, protected D1 migration and Worker deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Rehearse approved additive 0037 against disposable local D1
        run: |
          node --check scripts/lease-0037/activate-production.mjs
          bun run typecheck
          bun test tests/cocoDocumentationMastersApi.test.ts tests/cocoLeaseTerms.test.ts tests/dealerExcelLeaseRegisterPreview.test.ts
          bun run build
      - name: Recovery check, backup, additive D1 0037 and matching Worker
        run: bun scripts/lease-0037/activate-production.mjs
