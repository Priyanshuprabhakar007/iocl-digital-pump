name: Activate IOCL Draft Storage 0039 on Cloudflare

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-dealer-draft-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iocl-production-draft-0039-release
  cancel-in-progress: false

jobs:
  activate:
    name: D1 recovery check + draft table + Worker release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Validate Worker and draft save integration
        run: |
          node --check scripts/dealer-master-draft/activate-production-0039.mjs
          bun run typecheck
          bun test --timeout 15000 tests/dealerMasterDraftRoutes.test.ts tests/dealerMasterFullReconcile.test.ts
      - name: Verify Cloudflare recovery + apply ONLY 0039 + deploy Worker
        run: bun scripts/dealer-master-draft/activate-production-0039.mjs
