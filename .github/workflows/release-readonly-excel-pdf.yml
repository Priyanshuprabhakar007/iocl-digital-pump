name: Release Read-only Excel Evidence in Section-wise PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-readonly-excel-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iocl-worker-production-releases
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify tests and deploy read-only Worker
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install pinned dependencies
        run: bun install --frozen-lockfile
      - name: Validate TypeScript and immutable source / PDF regression
        run: |
          node --check scripts/release/activate-readonly-excel-pdf.mjs
          bun run typecheck
          bun test tests/dealerExcelReportSource.test.ts tests/cocoSectionWiseReport.test.ts
          bun run build
      - name: Verify production identity and deploy Worker without migrations
        run: bun scripts/release/activate-readonly-excel-pdf.mjs
