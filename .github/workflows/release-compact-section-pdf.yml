name: Release Complete Section-Wise COCO PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-compact-section-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iocl-worker-production-releases
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy PDF with blank empty sections
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate TypeScript, compact PDF tests and production build
        run: |
          node --check scripts/release/activate-readonly-excel-pdf.mjs
          bun run typecheck
          bun test tests/cocoSectionWisePdfCompact.test.ts tests/cocoSectionWiseReport.test.ts tests/dealerExcelReportSource.test.ts
          bun run build
      - name: Check live D1 identity and deploy PDF Worker without migrations
        run: bun scripts/release/activate-readonly-excel-pdf.mjs
